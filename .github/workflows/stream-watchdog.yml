name: Stream Watchdog

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Ensure Space Weather Stream is running
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          active=$(gh run list \
            --workflow=space-weather.yml \
            --status=in_progress \
            --json databaseId \
            --jq 'length' \
            --repo "${{ github.repository }}")

          queued=$(gh run list \
            --workflow=space-weather.yml \
            --status=queued \
            --json databaseId \
            --jq 'length' \
            --repo "${{ github.repository }}")

          echo "In-progress runs: $active"
          echo "Queued runs: $queued"

          if [ "$active" -eq 0 ] && [ "$queued" -eq 0 ]; then
            echo "No Space Weather stream is running."
            echo "Starting a new stream..."

            gh workflow run space-weather.yml \
              --repo "${{ github.repository }}" \
              --ref main

            echo "New stream workflow dispatched successfully."
          else
            echo "Space Weather stream is already running or queued."
            echo "Nothing to do."
          fi
